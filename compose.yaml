services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: collabcanvas
      POSTGRES_USER: collabcanvas
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabcanvas -d collabcanvas"]
      interval: 5s
      timeout: 3s
      retries: 10
  flyway:
    image: redgate/flyway:13.10.0
    profiles: [migrate]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/collabcanvas
      FLYWAY_USER: collabcanvas
      FLYWAY_PASSWORD: dev
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./backend/db/migration:/flyway/sql:ro
    command: migrate

volumes:
  postgres_data:
